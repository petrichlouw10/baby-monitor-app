<!DOCTYPE html>
<html>
<head><title>Baba Kamera</title></head>
<body>
  <h2>Baba Eenheid (Kamera)</h2>
  <video id="localVideo" autoplay playsinline muted style="width: 100%; max-width: 400px;"></video>
  
  <script src="https://socket.io"></script>
  <script>
    // 1. Koppel aan jou wolkbediener van Stap 1
    const socket = io('https://onrender.com'); 
    let peerConnection;

    // 2. Plak jou TURN-bediener konfigurasie van Stap 2 hier in
    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.metered.ca:80" },
        { urls: "turn:turn.metered.ca:80", username: "jou_gebruiker", credential: "jou_wagwoord" }
      ]
    };

    async function init() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('localVideo').srcObject = stream;

      // Koppel veilig aan die kamer met die wagwoord
      socket.emit('join-room', { roomName: 'baba_kamer_1', password: 'MyBaba2026!' });

      socket.on('user-connected', async (userId) => {
        peerConnection = new RTCPeerConnection(rtcConfig);
        stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit('signal', { roomName: 'baba_kamer_1', signal: { candidate: event.candidate } });
          }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('signal', { roomName: 'baba_kamer_1', signal: { sdp: offer } });
      });

      socket.on('signal', async (data) => {
        if (data.signal.sdp && data.signal.sdp.type === 'answer') {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
        } else if (data.signal.candidate) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
        }
      });
    }

    init();
  </script>
</body>
</html>
